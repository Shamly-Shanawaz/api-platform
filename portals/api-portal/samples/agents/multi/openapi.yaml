openapi: 3.1.0
info:
  title: Accounts Payable Assistant
  version: 2.0.0
servers:
  - url: https://api.acme-finance.com/ap-assistant/v2
paths:
  /invoices/triage:
    post:
      summary: Triage one invoice
      responses:
        "200":
          description: The triage result.
  /invoices/{id}/status:
    get:
      summary: Where an invoice is in the approval flow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The invoice's approval status.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearer: []
